<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente de Órdenes de Compra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Agente de Órdenes de Compra</h1>
    <span id="modo" class="chip" title="Modo de ejecución"></span>
  </header>

  <main class="layout">
    <aside class="panel">
      <label for="caso">Solicitud</label>
      <select id="caso"></select>
      <button id="procesar" class="primary" type="button">Procesar solicitud</button>
      <p class="hint">Elige un caso y procésalo. Si el agente necesita tu confirmación, aparecerá el botón para crear la OC.</p>
    </aside>

    <section class="chat" aria-label="Conversación">
      <div id="mensajes" class="mensajes" aria-live="polite"></div>
      <form id="form" class="composer">
        <input id="texto" type="text" autocomplete="off" maxlength="500" placeholder="Escribe un mensaje al agente (requiere modelo configurado)">
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>
